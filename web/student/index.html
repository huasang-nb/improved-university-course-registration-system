<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team 4 学生选课</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login-view" class="card">
    <h1>学生登录</h1>
    <label>学号 <input id="account" autocomplete="username"></label>
    <label>密码 <input id="password" type="password" autocomplete="current-password"></label>
    <button id="login-button">登录</button>
    <p id="login-error" class="error"></p>
    <p class="hint">本机演示密码：Demo2026!</p>
  </section>

  <section id="app-view" class="hidden">
    <header class="card">
      <strong id="who"></strong>
      <button id="logout-button">退出</button>
    </header>

    <div class="card row">
      <input id="keyword" placeholder="课程代码 / 名称 / 教师姓名">
      <button id="search-button">搜索</button>
      <button id="refresh-button">刷新课表与状态</button>
    </div>

    <p id="message" class="error"></p>

    <div class="card">
      <h2>可选课程</h2>
      <div id="courses" class="list"></div>
    </div>

    <div class="card">
      <h2>我的课表</h2>
      <div id="timetable" class="list"></div>
    </div>

    <div class="card">
      <h2>我的选课</h2>
      <div id="enrollments" class="list"></div>
    </div>

    <div class="card">
      <h2>修改密码</h2>
      <div class="row">
        <input id="current-password" type="password" placeholder="当前密码" autocomplete="current-password">
        <input id="new-password" type="password" placeholder="新密码" autocomplete="new-password">
        <button id="change-password-button">修改密码</button>
      </div>
      <p id="password-message" class="error"></p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
